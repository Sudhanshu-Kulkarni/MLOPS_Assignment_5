# This file mirrors ci-cd.yaml at the repo root (required location for GitHub Actions)
# GitHub Actions CI/CD workflow
# Triggers on push to main/master:
#   1. test  — runs the full test suite
#   2. docker — builds the Docker image (only on push, not PR)
#   3. deploy — SSHs into EC2 and restarts the container (only on push to main)

name: CI-CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Run automated tests ──────────────────────────────────────────
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt

      - name: Lint — syntax check all source modules
        run: |
          python -m py_compile src/utils.py
          python -m py_compile src/data_collection.py
          python -m py_compile src/data_processing.py
          python -m py_compile src/feature_selection.py
          python -m py_compile src/model_training.py
          python -m py_compile src/model_evaluation.py
          python -m py_compile src/predict.py
          python -m py_compile app/server.py
          echo "All source files passed syntax check"

      - name: Run test suite
        run: python test.py

  # ── Job 2: Build Docker image ────────────────────────────────────────────
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cifar10-classifier:latest .

      - name: Verify container starts
        run: |
          docker run -d --name test-container -p 8000:8000 cifar10-classifier:latest
          sleep 5
          docker logs test-container
          docker stop test-container
          docker rm test-container

  # ── Job 3: Deploy to EC2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/cifar10-classifier
            git pull origin main
            docker build -t cifar10-classifier:latest .
            docker stop cifar10-app || true
            docker rm   cifar10-app || true
            docker run -d --name cifar10-app \
              -p 80:8000 \
              --restart unless-stopped \
              cifar10-classifier:latest
            echo "Deployment complete"
            curl -f http://localhost/health && echo "Health check passed"
