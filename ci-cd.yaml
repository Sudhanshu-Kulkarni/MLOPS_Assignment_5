# GitHub Actions CI/CD workflow
# Flow: test → build lightweight Docker image → transfer to EC2 → run container
# EC2 only needs Docker — no pip install, no model training, no TensorFlow

name: CI-CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Run automated tests ───────────────────────────────────────────
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt

      - name: Lint — syntax check all source modules
        run: |
          python -m py_compile src/utils.py
          python -m py_compile src/data_collection.py
          python -m py_compile src/data_processing.py
          python -m py_compile src/feature_selection.py
          python -m py_compile src/model_training.py
          python -m py_compile src/model_evaluation.py
          python -m py_compile src/predict.py
          python -m py_compile app/server.py
          echo "All source files passed syntax check"

      - name: Run test suite
        run: python test.py

  # ── Job 2: Build lightweight Docker image ────────────────────────────────
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build lightweight Docker image
        run: docker build -t cifar10-classifier:latest .

      - name: Verify container health endpoint
        run: |
          docker run -d --name test-container -p 8000:8000 cifar10-classifier:latest
          sleep 8
          curl -f http://localhost:8000/health
          docker stop test-container
          docker rm test-container

  # ── Job 3: Deploy to EC2 (image transfer — no build on EC2) ─────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true   # EC2 secrets optional during initial setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for transfer
        run: docker build -t cifar10-classifier:latest .

      - name: Save Docker image to tar
        run: docker save cifar10-classifier:latest | gzip > cifar10-classifier.tar.gz

      - name: Transfer image to EC2 and deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   cifar10-classifier.tar.gz
          target:   /home/ec2-user/

      - name: Load and run container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker load < /home/ec2-user/cifar10-classifier.tar.gz
            docker stop cifar10-app || true
            docker rm   cifar10-app || true
            docker run -d \
              --name cifar10-app \
              -p 80:8000 \
              --restart unless-stopped \
              cifar10-classifier:latest
            rm -f /home/ec2-user/cifar10-classifier.tar.gz
            sleep 5
            curl -f http://localhost/health && echo "Deployment successful"
