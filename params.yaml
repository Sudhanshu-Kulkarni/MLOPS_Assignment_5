# Tunable hyperparameters for the CIFAR-10 classification pipeline.
# Change any value here and re-run: dvc repro

base:
  random_seed: 42
  num_classes: 10

data_collection:
  dataset_name: cifar10           # cifar10 | synthetic
  max_samples: 15000               # keep small for assignment demos
  output_dir: data/raw

data_processing:
  image_size: 32                  # 1. target height/width
  validation_split: 0.20          # 2. share of train used for validation
  test_split: 0.15
  normalize: true
  augmentation:
    enabled: true
    rotation_range: 15            # 3. degrees
    horizontal_flip: true         # 4. left-right flip
    zoom_range: 0.10              # 5. random zoom
    width_shift_range: 0.10
    height_shift_range: 0.10
    brightness_delta: 0.10

feature_selection:
  method: selectkbest             # variance | selectkbest | pca
  variance_threshold: 0.01        # 6. drop near-constant pixels
  k_best: 256                     # 7. number of features to keep
  pca_components: 64
  score_func: f_classif           # f_classif | mutual_info

model_training:
  architecture: cnn               # cnn | mlp
  learning_rate: 0.001            # 8.
  batch_size: 32                  # 9.
  epochs: 20                       # 10.
  optimizer: adam                 # 11. adam | sgd | rmsprop
  dropout_rate: 0.30              # 12.
  dense_units: 128                # 13.
  conv_filters: [32, 64]
  early_stopping_patience: 3      # 14.
  l2_regularization: 0.0001       # 15.

model_evaluation:
  average: macro
  save_plots: true
